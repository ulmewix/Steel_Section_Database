schema_version = 1
id = "L"
title = "L – hot-rolled unequal-leg angles"
shape = "L"
# A mixed catalogue range, not one standard's range: EN 10056-1:1998 gives the calculation convention (sharp heel,
# r2 = r1/2) and 19 of the 39 sizes; the others are DIN 1029 and manufacturer sizes. Radii that differ between catalogues
# (docs/DATA_MODEL.md): L 150x75x11 keeps the DIN 1029 10.5 / 5.5 (the only row with r2 != r1/2); L 150x100x14 carries
# 12 / 6 (ArcelorMittal); L 75x50x7 keeps 7 / 3.5 (unresolved). Not a claim of verification.
standard = "Mixed range: EN 10056-1:1998 (calculation convention, 19 of 39 sizes); other sizes DIN 1029, manufacturers"
process = "hot_rolled"

[designation]
pattern = "L {h}x{b}x{t}"
aliases = ["L{h}x{b}x{t}", "LNP {h}x{b}x{t}", "LNP{h}x{b}x{t}"]

# Convention-dependent properties published by this series (see docs/CONVENTIONS.md); Wt, Iw and the shear centre:
# no documented convention.
[conventions]
It = { method = "IT_ROLLED_L_FILLET_V1" }
