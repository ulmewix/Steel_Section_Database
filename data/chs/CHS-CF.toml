schema_version = 1
id = "CHS-CF"
title = "CHS – circular hollow sections, cold formed"
shape = "CHS"
# Specification that defines this series (designations, nominal dimensions); not a claim of verification.
# EN 10219-2:2006: edition of the It/Wt definition of CHS (B.2) and of the diameter list (Table C.1); only the 31 standard
# outside diameters are included (docs/DATA_MODEL.md). Not a claim that every size is in the standard's tables.
standard = "EN 10219-2:2006"
process = "cold_formed"

[designation]
pattern = "CHS {D}x{t}"
aliases = ["CHS{D}x{t}"]

# Convention-dependent properties published by this series (see docs/CONVENTIONS.md).
[conventions]
It = { method = "IT_CHS_EXACT_V1" }
Wt = { method = "IT_CHS_EXACT_V1" }
Avy = { method = "AV_CHS_EN1993_V1" }
Avz = { method = "AV_CHS_EN1993_V1" }
